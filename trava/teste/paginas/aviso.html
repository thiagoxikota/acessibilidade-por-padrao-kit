<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aviso criado no clique</title>
<style>.selo { font-size: 14px; height: 20px; overflow: hidden; width: 160px; }</style></head>
<body>
<main>
  <h1>Planos</h1>
  <button id="assinar" type="button">Assinar</button>
</main>
<script>
  document.getElementById('assinar').addEventListener('click', function () {
    var p = document.createElement('p');
    p.id = 'aviso';
    p.className = 'selo';
    p.textContent = 'Mais vendido';
    document.querySelector('main').appendChild(p);
  });
</script>
</body>
</html>
