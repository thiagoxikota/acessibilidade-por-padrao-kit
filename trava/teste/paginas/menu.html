<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu</title></head>
<body>
<header>
  <button id="abrir-menu" type="button" aria-expanded="false" aria-controls="menu">Abrir menu</button>
  <nav id="menu" aria-label="Principal" hidden>
    <button id="fechar-menu" type="button"></button>
    <ul><li><a href="#inicio">Inicio</a></li></ul>
  </nav>
</header>
<main><h1>Inicio</h1></main>
<script>
  document.getElementById('abrir-menu').addEventListener('click', function () {
    document.getElementById('menu').hidden = false;
    this.setAttribute('aria-expanded', 'true');
  });
</script>
</body>
</html>
