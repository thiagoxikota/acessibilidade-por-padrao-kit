<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Layout apertado</title>
<style>
  body { margin: 0; font-size: 1rem; }
  #faixa { width: 600px; }
  /* Cabem em 100% e cortam em 200%: caixa de altura fixa em px. */
  #cartao { height: 24px; overflow: hidden; width: 240px; }
  #selo { font-size: 14px; height: 20px; overflow: hidden; width: 160px; }
  #caixa { height: 24px; overflow: hidden; width: 240px; }
  /* Ja corta em 100%, de proposito: nao e efeito da ampliacao. */
  #carrossel { overflow: hidden; white-space: nowrap; width: 200px; }
</style></head>
<body>
<main>
  <h1>Planos</h1>
  <p id="faixa">Esta faixa tem largura fixa e obriga a rolar para o lado em tela estreita.</p>
  <p id="cartao">Plano anual com desconto</p>
  <p id="selo">Mais vendido</p>
  <div id="caixa"><span>Frete gratis</span></div>
  <div id="carrossel">Oferta um, oferta dois, oferta tres, oferta quatro, oferta cinco</div>
</main>
</body>
</html>
