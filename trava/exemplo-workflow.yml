# Copie para .github/workflows/acessibilidade.yml no seu projeto.
# Este exemplo supoe a pasta trava/ do kit copiada para acessibilidade/trava/ no seu repositorio.
# Ajuste o passo que sobe o site e as rotas.
#
# Para a trava valer: torne o job "trava" obrigatorio na regra da branch main
# (Settings > Rules ou Branches > Require status checks to pass) e faca o deploy depender dele.
name: Acessibilidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trava:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Suba o seu site aqui. Exemplo para um site estatico ja gerado em dist/:
      - name: Gerar e servir o site
        run: |
          npm ci
          npm run build
          npx --yes serve@14.2.4 dist -l 4321 &
          npx --yes wait-on@8.0.1 http://localhost:4321

      - name: Instalar a trava
        working-directory: acessibilidade/trava
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar a trava
        working-directory: acessibilidade/trava
        env:
          BASE_URL: http://localhost:4321
          ROTAS: /,/contato
        run: npm run trava

      - name: Guardar relatorio e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade
          path: |
            acessibilidade/trava/trava-relatorio.json
            acessibilidade/trava/trava-capturas/

