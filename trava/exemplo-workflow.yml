# Copie para .github/workflows/acessibilidade.yml no seu projeto.
# Este exemplo supoe a pasta trava/ do kit copiada para acessibilidade/trava/ no seu repositorio.
# Ajuste o passo que sobe o site e as rotas.
#
# Para a trava valer, siga trava/github.md: o job "trava" vira check obrigatorio na branch
# principal (regra pronta em trava/regra-da-main.json) e o deploy depende dele.
#
# Tres cuidados para a trava nao passar calada nem segurar o pull request para sempre:
# - Nao filtre o gatilho pull_request (paths, branches) nem use [skip ci] no commit.
#   Workflow pulado deixa o check obrigatorio "Pending", e o pull request nao entra.
# - Nao coloque "if" no job trava, nem "needs" de um job que pode falhar antes.
#   Job pulado aparece como sucesso, mesmo sendo obrigatorio.
# - O nome "trava" precisa ser unico entre todos os workflows do repositorio.
name: Acessibilidade

on:
  pull_request:
  push:
    branches: [main]
  # So conta se o repositorio usa fila de merge (merge queue): a fila tambem espera o check.
  merge_group:

permissions:
  contents: read

jobs:
  trava:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Suba o seu site aqui. Exemplo para um site estatico ja gerado em dist/:
      - name: Gerar e servir o site
        run: |
          npm ci
          npm run build
          npx --yes serve@14.2.4 dist -l 4321 &
          npx --yes wait-on@8.0.1 http://localhost:4321

      - name: Instalar a trava
        working-directory: acessibilidade/trava
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar a trava
        working-directory: acessibilidade/trava
        env:
          BASE_URL: http://localhost:4321
          ROTAS: /,/contato
        run: npm run trava

      - name: Guardar relatorio e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acessibilidade
          path: |
            acessibilidade/trava/trava-relatorio.json
            acessibilidade/trava/trava-capturas/

  # Exemplo: deploy so depois da trava passar, e so no push da main.
  # Se a trava falhar, este job nem roda, e nada vai pro ar.
